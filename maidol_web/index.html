<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>MaidolRhythm</title>
		<style>

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: #FF75B5;
	background: #FFF0FA;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ===== メイドル ローディング画面 ===== */

#status {
	position: absolute;
	inset: 0;
	background: linear-gradient(
		135deg,
		#FFF0FA,
		#FFFFFF,
		#FFE6F3
	);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	gap: 22px;
}

/* Godot標準ロゴ画像は使用しない */

#status-splash {
	display: none;
}

/* ローディングタイトル */

#status::before {
	content: "♡ MAIDOL!! ♡";
	display: block;
	color: #FF75B5;
	font-family: sans-serif;
	font-weight: bold;
	font-size: clamp(28px, 5vw, 48px);
	letter-spacing: 2px;
	margin-bottom: 10px;
}

/* 読み込み中の文字 */

#status::after {
	content: "Now Loading... ♡";
	display: block;
	color: #F28AB9;
	font-family: sans-serif;
	font-weight: bold;
	font-size: clamp(16px, 3vw, 23px);
	letter-spacing: 1px;
	margin-top: 8px;
}

/* 読み込みゲージ */

#status-progress {
	display: block;
	position: relative;
	width: min(65%, 420px);
	height: 14px;
	margin: 0;
	border: 2px solid #FFB7D7;
	border-radius: 20px;
	overflow: hidden;
	background: #FFFFFF;
	accent-color: #FF85BA;
	appearance: none;
	-webkit-appearance: none;
}

#status-progress::-webkit-progress-bar {
	background: #FFFFFF;
	border-radius: 20px;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(
		90deg,
		#FFB0D2,
		#FF75B5
	);
	border-radius: 20px;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(
		90deg,
		#FFB0D2,
		#FF75B5
	);
	border-radius: 20px;
}

/* エラー表示 */

#status-notice {
	background: #FFFFFF;
	border-radius: 16px;
	border: 2px solid #FFB7D7;
	color: #D85C96;
	font-family: sans-serif;
	line-height: 1.5;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* ===== ローディング装飾 ===== */

.loading-decoration {
	position: absolute;
	inset: 0;
	pointer-events: none;
}

.loading-decoration span {
	position: absolute;
	color: #FFC1DC;
	font-size: clamp(24px, 5vw, 48px);
	animation: heart-float 2.5s ease-in-out infinite;
}

.loading-decoration span:nth-child(1) {
	top: 20%;
	left: 18%;
}

.loading-decoration span:nth-child(2) {
	top: 25%;
	right: 20%;
	animation-delay: 0.8s;
}

.loading-decoration span:nth-child(3) {
	bottom: 20%;
	left: 25%;
	animation-delay: 1.4s;
}

.loading-content {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 18px;
	z-index: 1;
}

.loading-mascot {
	width: 110px;
	height: 110px;
	border-radius: 50%;
	background: #FFFFFF;
	border: 4px solid #FFD0E5;
	display: flex;
	align-items: center;
	justify-content: center;
	color: #FF85BA;
	font-size: 64px;
	box-shadow: 0 5px 20px #F8C8DE;
	animation: mascot-bounce 1.5s ease-in-out infinite;
}

.loading-caption {
	color: #E987B5;
	font-family: sans-serif;
	font-size: 14px;
}

@keyframes heart-float {
	0%, 100% {
		transform: translateY(0);
		opacity: 0.6;
	}
	50% {
		transform: translateY(-12px);
		opacity: 1;
	}
}

@keyframes mascot-bounce {
	0%, 100% {
		transform: translateY(0);
	}
	50% {
		transform: translateY(-8px);
	}
}

		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		
<div id="status">
	<div class="loading-decoration">
		<span>♡</span>
		<span>♡</span>
		<span>♡</span>
	</div>

	<div class="loading-content">
		<div class="loading-mascot">
			♡
		</div>

		<div class="loading-caption">
			Please wait a moment
		</div>
	</div>

	<progress id="status-progress"></progress>
	<div id="status-notice"></div>
</div>


		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":12639756,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
