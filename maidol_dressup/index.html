

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f7">
  <title>MAIDOL DRESS UP ♡</title>
  <link rel="stylesheet" href="dressup.css">
  <script src="dressup.js" defer></script>
</head>

<body>
  <div class="app">

    <!-- ヘッダー -->
    <header class="header">
      <div class="header-logo">
        <span class="logo-decoration">♡</span>
        <div>
          <h1>MAIDOL DRESS UP</h1>
          <p>MOE MOE ♡ CUTE COORDINATE</p>
        </div>
        <span class="logo-decoration">♡</span>
      </div>
    </header>

    <!-- メイン -->
    <main class="main-layout">

      <!-- 左：キャラクタープレビュー -->
      <section class="preview-section">

        <div class="section-heading">
          <span>♡</span>
          <h2>CHARACTER</h2>
          <span>♡</span>
        </div>

        <div class="character-card">

          <div class="preview-decoration decoration-top">
            ✧ ♡ ✧
          </div>

          <div id="character-stage" class="character-stage">

            <!-- キャラクター画像の表示領域 -->
            <div id="character-layers" class="character-layers">
              <p class="loading-message">
                ♡ CHARACTER ♡
                <br>
                <span>素材を読み込みます</span>
              </p>
            </div>

          </div>

          <div class="preview-decoration decoration-bottom">
            ♡ ✧ ♡ ✧ ♡
          </div>

        </div>

        <div class="preview-footer">
          <span>✧ YOUR ORIGINAL MAIDOL ✧</span>
        </div>

      </section>

      <!-- 右：アイテム選択 -->
      <section class="item-section">

        <div class="section-heading">
          <span>♡</span>
          <h2>ITEM SELECT</h2>
          <span>♡</span>
        </div>

        <!-- カテゴリー -->
        <nav class="category-list" aria-label="アイテムカテゴリー">

          <button class="category-button active" data-category="SK">
            素体
          </button>

          <button class="category-button" data-category="HB">
            後ろ髪
          </button>

          <button class="category-button" data-category="HF">
            前髪
          </button>

          <button class="category-button" data-category="HA">
            髪飾り
          </button>

          <button class="category-button" data-category="ES">
            目の形
          </button>

          <button class="category-button" data-category="IC">
            瞳の色
          </button>

          <button class="category-button" data-category="BR">
            眉
          </button>

          <button class="category-button" data-category="MO">
            口
          </button>

          <button class="category-button" data-category="MK">
            メイク
          </button>

          <button class="category-button" data-category="DR">
            ワンピース
          </button>

          <button class="category-button" data-category="TP">
            トップス
          </button>

          <button class="category-button" data-category="BT">
            ボトムス
          </button>

          <button class="category-button" data-category="SH">
            シューズ
          </button>

        </nav>

        <!-- 選択中カテゴリー -->
        <div class="item-panel">

          <div class="item-panel-heading">
            <h3 id="category-title">素体</h3>
            <span>SELECT ITEM ♡</span>
          </div>

          <div id="item-list" class="item-list">
            <p class="empty-message">
              アイテムを読み込みます ♡
            </p>
          </div>

        </div>

        <!-- 操作ボタン -->
        <div class="action-buttons">
          <button id="reset-button" class="action-button reset-button">
            ↻ RESET
          </button>

          <button id="download-button" class="action-button download-button">
            ♡ PNG EXPORT
          </button>
        </div>

      </section>

    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>♡ MOE MOE ♡ CUTE MAIDOL !! ♡</p>
    </footer>

  </div>
</body>
</html>
