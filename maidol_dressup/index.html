
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メイドル♡きせかえ</title>
  <link rel="stylesheet" href="dressup.css">
  <script src="dressup.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>♡ メイドル きせかえ ♡</h1>
    <p>すきなコーディネートをつくってね！</p>
  </header>

  <main class="app">
    <section class="preview-area">
      <div class="preview-frame">
        <canvas id="character-canvas" width="1500" height="3000"></canvas>
      </div>

      
<div class="preview-options">
  <label class="check-option">
    <input type="checkbox" id="face-overlay">
    前髪選択中に顔パーツを重ねて表示
  </label>

  <div class="zoom-control">
    <label for="preview-zoom">顔まわりのズーム</label>
    <input
      type="range"
      id="preview-zoom"
      min="1"
      max="3"
      step="0.1"
      value="1"
    >
    <span id="zoom-value">100%</span>
    <button type="button" id="zoom-reset">リセット</button>
  </div>
</div>


      <div class="action-buttons">
        <button id="reset-button" type="button">リセット</button>
        <button id="download-button" type="button">PNGで保存</button>
      </div>
      <p id="status-message" aria-live="polite"></p>
    </section>

    <section class="control-area">
      <section class="control-box">
        <h2>♡ ヘアカラー</h2>
        <p class="help-text">前髪・後ろ髪・眉毛の色をまとめて変更します。</p>
        <div id="hair-color-list" class="color-list"></div>
      </section>

      <section class="control-box">
        <h2>♡ 瞳の色</h2>
        <p class="help-text">左右の瞳を別々に設定できます。</p>
        <div class="eye-targets">
          <button type="button" class="target-button active" data-eye-target="both">左右同じ色</button>
          <button type="button" class="target-button" data-eye-target="left">画面左の瞳</button>
          <button type="button" class="target-button" data-eye-target="right">画面右の瞳</button>
        </div>
        <label class="check-option">
          <input type="checkbox" id="same-eye-color" checked>
          左右の瞳を同じ色にする
        </label>
      </section>

      <section class="control-box">
        <h2>♡ アイテム</h2>
        <nav id="category-list" class="category-list">
          <button type="button" data-category="SK">肌</button>
          <button type="button" data-category="HB">後ろ髪</button>
          <button type="button" data-category="HF" class="active">前髪</button>
          <button type="button" data-category="HA">髪飾り</button>
          <button type="button" data-category="ES">目の形</button>
          <button type="button" data-category="IC">瞳の色</button>
          <button type="button" data-category="BR">眉毛</button>
          <button type="button" data-category="MO">口</button>
          <button type="button" data-category="MK">メイク</button>
          <button type="button" data-category="DR">ワンピース</button>
          <button type="button" data-category="TP">トップス</button>
          <button type="button" data-category="BT">ボトムス</button>
          <button type="button" data-category="SH">靴</button>
        </nav>

        <h3 id="category-title">前髪</h3>
        <div id="item-list" class="item-list"></div>
      </section>
    </section>
  </main>
</body>
</html>
