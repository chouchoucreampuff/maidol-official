  <style>
    /* ===== SNSページ ===== */

    .sns-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      width: min(900px, 100%);
      margin: 36px auto 0;
    }

    .sns-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 230px;
      padding: 28px 14px 24px;
      overflow: hidden;
      border: 2px solid #fff;
      border-radius: 25px;
      background: linear-gradient(145deg, #fff, #fff5fb);
      box-shadow: 0 8px 25px #c38bb31c;
      text-align: center;
      transition: transform .2s, box-shadow .2s;
    }

    .sns-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 13px 30px #c38bb32e;
    }

    .sns-symbol {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 66px;
      height: 66px;
      margin-bottom: 15px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 4px 15px #b47da01a;
      font-family: Arial, sans-serif;
      font-size: 2rem;
      font-weight: 900;
    }

    .sns-card.tiktok .sns-symbol {
      color: #171717;
      background: #f5fdff;
    }

    .sns-card.x-social .sns-symbol {
      color: #171717;
    }

    .sns-card.instagram .sns-symbol {
      color: #d95b9f;
      background: #fff0f8;
    }

    .sns-name {
      margin: 0;
      color: #bd5d9b;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: .06em;
    }

    .sns-account {
      margin: 7px 0 14px;
      color: #99839d;
      font-size: .78rem;
      overflow-wrap: anywhere;
    }

    .sns-open {
      display: inline-block;
      padding: 9px 18px;
      border: 1px solid #f2d5e7;
      border-radius: 99px;
      background: white;
      color: #c45e9b;
      font-size: .78rem;
      font-weight: 900;
    }

    .sns-note {
      margin: 30px auto 0;
      color: #a18ba4;
      font-family: 'Kiwi Maru', sans-serif;
      font-size: .8rem;
      line-height: 1.9;
      text-align: center;
    }

    @media (max-width: 650px) {
      .sns-list {
        grid-template-columns: 1fr;
        gap: 14px;
        max-width: 400px;
        margin-top: 25px;
      }

      .sns-card {
        flex-direction: row;
        justify-content: flex-start;
        min-height: 120px;
        padding: 18px;
        gap: 15px;
        text-align: left;
      }

      .sns-symbol {
        flex: 0 0 58px;
        width: 58px;
        height: 58px;
        margin: 0;
        border-radius: 18px;
        font-size: 1.8rem;
      }

      .sns-info {
        flex: 1;
        min-width: 0;
      }

      .sns-name {
        font-size: 1rem;
      }

      .sns-account {
        margin: 5px 0 0;
        font-size: .75rem;
      }

      .sns-open {
        flex: 0 0 auto;
        padding: 8px 11px;
        font-size: .72rem;
      }
    }
  </style>
